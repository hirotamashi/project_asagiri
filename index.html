<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кэйтаро Кимура</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&text=%E3%81%8D%E3%82%80%E3%82%89%E3%81%91%E3%81%84%E3%81%9F%E3%82%8D%E3%81%86&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-night: #0B1220;
    --panel: #1A2740;
    --panel-line: #253352;
    --ink: #E8ECF2;
    --ink-soft: #8FA3BF;
    /* Keitaro's own accent — moonlight, not tied to any one work */
    --accent: #9CB3D6;
    --accent-soft: #6B84AC;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--sky-night);
    color: var(--ink);
    font-family: 'Noto Sans', sans-serif;
    font-weight: 300;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Horizon bar: signature element ---- */
  .horizon {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    z-index: 100;
    background: linear-gradient(90deg, var(--sky-night) 0%, var(--accent) 50%, var(--panel-line) 100%);
    background-size: 220% 100%;
    animation: dawn-drift 14s ease-in-out infinite alternate;
  }

  @keyframes dawn-drift {
    from { background-position: 0% 0; }
    to { background-position: 100% 0; }
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---- Hero ---- */
  .hero {
    min-height: 68vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 120% 60% at 50% 100%, rgba(156,179,214,0.10), transparent 70%),
      var(--sky-night);
  }

  .hero::before {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 40%;
    background: linear-gradient(180deg, transparent, rgba(156,179,214,0.06));
    pointer-events: none;
  }

  .hero .wrap { width: 100%; }

  .kicker {
    font-family: 'Noto Serif', 'Noto Serif JP', serif;
    font-size: 0.95rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 28px;
  }

  h1.name {
    font-family: 'Noto Serif', 'Noto Serif JP', serif;
    font-weight: 500;
    font-size: clamp(2.6rem, 7vw, 4.4rem);
    line-height: 1.08;
    margin: 0 0 8px;
    color: var(--ink);
  }

  .name em {
    font-style: italic;
    color: var(--accent);
  }

  /* ---- Bibliography ---- */
  .works-section {
    padding: 20px 0 90px;
    border-top: 1px solid var(--panel-line);
  }

  .works-label {
    font-size: 0.78rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 56px 0 28px;
  }

  .works {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .work-card {
    display: block;
    position: relative;
    padding: 26px 28px 26px 32px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
  }

  .work-card::before {
    content: "";
    position: absolute;
    left: 0; top: 14px; bottom: 14px;
    width: 3px;
    border-radius: 2px;
    background: var(--card-accent, var(--accent));
  }

  .work-card:hover {
    border-color: var(--card-accent, var(--accent));
    transform: translateX(2px);
  }

  .work-title {
    font-family: 'Noto Serif', 'Noto Serif JP', serif;
    font-weight: 500;
    font-size: clamp(1.3rem, 3vw, 1.6rem);
    margin: 0 0 10px;
    color: var(--ink);
  }

  .work-note {
    margin: 0 0 16px;
    font-size: 0.95rem;
    color: var(--ink-soft);
    max-width: 46ch;
  }

  .work-link {
    display: inline-block;
    font-size: 0.9rem;
    letter-spacing: 0.03em;
    color: var(--card-accent, var(--accent));
  }

  /* ---- Footer ---- */
  footer {
    padding: 0 0 80px;
    text-align: center;
  }

  .tg-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    padding: 12px 26px;
    border: 1px solid var(--accent-soft);
    border-radius: 999px;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .tg-link:hover {
    background: var(--accent);
    color: var(--sky-night);
  }

  .signature {
    margin-top: 32px;
    font-family: 'Noto Serif', 'Noto Serif JP', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 0.85rem;
    letter-spacing: 0.03em;
  }

  @media (max-width: 640px) {
    .hero { min-height: 52vh; }
    .work-card { padding: 22px 20px 22px 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .horizon { animation: none; background-position: 50% 0; }
    .work-card { transition: none; }
  }
</style>
</head>
<body>

<div class="horizon" id="horizon"></div>

<header class="hero">
  <div class="wrap">
    <p class="kicker" lang="ja">きむら　けいたろう</p>
    <h1 class="name">Кэйтаро <em>Кимура</em></h1>
  </div>
</header>

<section class="works-section">
  <div class="wrap">
    <p class="works-label">Рассказы</p>

    <div class="works">
      <a class="work-card" href="voobrazhenie.html" style="--card-accent:#E39FC2;">
        <h2 class="work-title">Воображение</h2>
        <p class="work-note">Написал за полчаса. Мой первый рассказ — или просто мысли, я так и не решил. Не судите строго.</p>
        <span class="work-link">Читать →</span>
      </a>

        <span class="work-link">Читать →</span>

      ▲ -->

</section>

<footer>
  <div class="wrap">

    <p class="signature">— К. К.</p>
  </div>
</footer>

</html>
