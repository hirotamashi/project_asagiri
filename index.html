<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кейтаро Кимура</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-night: #0B1220;
    --sky-dawn: #F4A259;
    --panel: #1A2740;
    --panel-line: #253352;
    --ink: #E8ECF2;
    --ink-soft: #8FA3BF;
    --accent: #F4A259;
    --accent-soft: #C97D4A;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--sky-night);
    color: var(--ink);
    font-family: 'Noto Sans', sans-serif;
    font-weight: 300;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Horizon bar: signature element ---- */
  .horizon {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    z-index: 100;
    background: linear-gradient(90deg, var(--sky-night) 0%, var(--sky-dawn) 50%, var(--panel-line) 100%);
    background-size: 220% 100%;
    animation: dawn-drift 14s ease-in-out infinite alternate;
  }

  @keyframes dawn-drift {
    from { background-position: 0% 0; }
    to { background-position: 100% 0; }
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---- Hero ---- */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 120% 60% at 50% 100%, rgba(244,162,89,0.10), transparent 70%),
      var(--sky-night);
  }

  .hero::before {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 40%;
    background: linear-gradient(180deg, transparent, rgba(244,162,89,0.06));
    pointer-events: none;
  }

  .kicker {
    font-family: 'Noto Serif', serif;
    font-size: 0.95rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 28px;
  }

  .kicker .glyph {
    color: var(--accent);
    letter-spacing: 0;
    margin-right: 12px;
    font-size: 1.1rem;
  }

  h1.name {
    font-family: 'Noto Serif', serif;
    font-weight: 500;
    font-size: clamp(2.6rem, 7vw, 4.4rem);
    line-height: 1.08;
    margin: 0 0 8px;
    color: var(--ink);
  }

  .name em {
    font-style: italic;
    color: var(--accent);
  }

  /* ---- Work presented directly in hero ---- */
  .hero-work {
    margin-top: 64px;
  }

  .hero-work-label {
    font-size: 0.78rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }

  .hero-work-title {
    font-family: 'Noto Serif', serif;
    font-weight: 500;
    font-size: clamp(1.5rem, 3.2vw, 1.9rem);
    margin: 0 0 28px;
    color: var(--ink);
  }

  .read-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--sky-night);
    background: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
    padding: 14px 32px;
    border-radius: 999px;
    transition: background 0.25s ease, transform 0.25s ease;
  }

  .read-btn:hover {
    background: #ffb877;
    transform: translateX(2px);
  }

  /* ---- Footer ---- */
  footer {
    padding: 56px 0 80px;
    border-top: 1px solid var(--panel-line);
    text-align: center;
  }

  .tg-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    padding: 12px 26px;
    border: 1px solid var(--accent-soft);
    border-radius: 999px;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .tg-link:hover {
    background: var(--accent);
    color: var(--sky-night);
  }

  .signature {
    margin-top: 32px;
    font-family: 'Noto Serif', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 0.85rem;
    letter-spacing: 0.03em;
  }

  @media (max-width: 640px) {
    .hero { min-height: 100vh; }
    .hero-work { margin-top: 48px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .horizon { animation: none; background-position: 50% 0; }
    .read-btn { transition: none; }
  }
</style>
</head>
<body>

<div class="horizon" id="horizon"></div>

<header class="hero">
  <div class="wrap">
    <p class="kicker"><span class="glyph">暁</span>Прежде чем взойдёт солнце</p>
    <h1 class="name">Кейтаро <em>Кимура</em></h1>

    <div class="hero-work">
      <p class="hero-work-label">Рассказ</p>
      <h2 class="hero-work-title">В ожидании рассвета</h2>
      <a class="read-btn" href="v-ozhidanii-rassveta.html">Читать →</a>
    </div>
  </div>
</header>

<footer>
  <div class="wrap">
    <a class="tg-link" href="https://t.me/+_HiH-VEV-UIyMGQy" target="_blank" rel="noopener">Обсудить в Telegram →</a>
    <p class="signature">— К. К.</p>
  </div>
</footer>

</body>
</html>
